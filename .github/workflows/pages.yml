name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs app
        run: npm run build --workspace=apps/docs

      - name: Build sandbox app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build --workspace=apps/sandbox

      - name: Build project apps
        run: |
          npm run build --workspace=apps/projects/chat-widget
          npm run build --workspace=apps/projects/forms
          npm run build --workspace=apps/projects/virtual-events

      - name: Prepare Pages artifact
        run: |
          rm -rf dist
          mkdir -p dist/docs
          cp -R apps/docs/dist/. dist/docs/
          mkdir -p dist/sandbox
          cp -R apps/sandbox/dist/. dist/sandbox/
          mkdir -p dist/chat-widget
          cp -R apps/projects/chat-widget/dist/. dist/chat-widget/
          mkdir -p dist/forms
          cp -R apps/projects/forms/dist/. dist/forms/
          mkdir -p dist/virtual-events
          cp -R apps/projects/virtual-events/dist/. dist/virtual-events/

          # GitHub Pages SPA fallback:
          # Redirect unknown routes (e.g. /docs/components/...) into the right app entry via ?p=/...
          cat > dist/404.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Redirecting…</title>
              <meta http-equiv="refresh" content="0;url=./" />
              <script>
                (function () {
                  var repoBase = "/gecko-elements";
                  var path = window.location.pathname || "/";
                  if (path.indexOf(repoBase) !== 0) {
                    window.location.replace(repoBase + "/");
                    return;
                  }
                  var rel = path.slice(repoBase.length) || "/";
                  var targetApp = null;
                  if (rel === "/docs" || rel.indexOf("/docs/") === 0) targetApp = "docs";
                  if (rel === "/sandbox" || rel.indexOf("/sandbox/") === 0) targetApp = "sandbox";
                  if (rel === "/chat-widget" || rel.indexOf("/chat-widget/") === 0) targetApp = "chat-widget";
                  if (rel === "/forms" || rel.indexOf("/forms/") === 0) targetApp = "forms";
                  if (rel === "/virtual-events" || rel.indexOf("/virtual-events/") === 0) targetApp = "virtual-events";

                  if (!targetApp) {
                    window.location.replace(repoBase + "/");
                    return;
                  }

                  // Ensure folder root loads with trailing slash.
                  if (rel === "/" + targetApp) {
                    window.location.replace(repoBase + "/" + targetApp + "/");
                    return;
                  }

                  var withinApp = rel.slice(("/" + targetApp).length) || "/";
                  var search = window.location.search || "";
                  var hash = window.location.hash || "";
                  var next =
                    repoBase +
                    "/" +
                    targetApp +
                    "/?p=" +
                    encodeURIComponent(withinApp) +
                    (search ? "&" + search.slice(1) : "") +
                    hash;

                  window.location.replace(next);
                })();
              </script>
            </head>
            <body></body>
          </html>
          EOF

          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Gecko Elements</title>
              <style>
                :root { color-scheme: light dark; }
                body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
                main { max-width: 760px; margin: 0 auto; padding: 48px 20px; }
                a { color: inherit; }
                .card { border: 1px solid rgba(127,127,127,.35); border-radius: 12px; padding: 16px; }
                .muted { opacity: .75; }
              </style>
            </head>
            <body>
              <main>
                <h1>Gecko Elements</h1>
                <p class="muted">Monorepo GitHub Pages site.</p>
                <div class="card">
                  <p><a href="./docs/">Open Docs</a></p>
                  <p><a href="./sandbox/">Open Sandbox</a></p>
                  <p><a href="./chat-widget/">Open Chat Widget</a></p>
                  <p><a href="./forms/">Open Forms</a></p>
                  <p><a href="./virtual-events/">Open Virtual Events</a></p>
                </div>
              </main>
            </body>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

