<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gecko Elements</title>
    <!-- Apply saved theme before first paint (next-themes runs after JS loads; without this, dark mode flashes light). Must match ThemeProvider: storageKey, defaultTheme, enableSystem=false, attribute=class -->
    <script>
      (function () {
        var storageKey = "gecko-elements-theme"
        var root = document.documentElement
        try {
          var stored = localStorage.getItem(storageKey)
          var theme = stored === "dark" ? "dark" : "light"
          root.classList.remove("light", "dark")
          root.classList.add(theme)
          root.style.colorScheme = theme
        } catch (_) {}
      })()
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
